name: Apply approved Android UX patch

on:
  push:
    branches:
      - work/android-ux-mode-polish
    paths:
      - .github/workflows/apply-android-ux-mode-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/android-ux-mode-polish
          fetch-depth: 0
      - name: Apply approved patch
        shell: bash
        run: |
          tr -d '\r\n' < .github/android-ux-mode-polish.bundle.b64 | base64 -d > /tmp/android-ux-mode-polish.bundle
          git bundle verify /tmp/android-ux-mode-polish.bundle
          git fetch /tmp/android-ux-mode-polish.bundle HEAD
          git checkout FETCH_HEAD -- .
          rm .github/android-ux-mode-polish.bundle.b64
          rm .github/workflows/apply-android-ux-mode-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): clarify routing modes and stabilize VPN startup"
          git push origin HEAD:work/android-ux-mode-polish
