name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SING_BOX_VERSION: "1.14.1"
  SING_BOX_ANDROID_ARM64_SHA256: "34e2373cfcdd17ef3a0cac13d7f9f971e206257413a9f7b1da63ea02bcf88aab"
  SING_BOX_ANDROID_AMD64_SHA256: "43d1b49a3086ad12092f028cbe3efb28422c2a6114d0dfb0ea18d0c2427573dc"

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format workspace
        run: cargo fmt --all -- --check

      - name: Verify generated UI theme
        run: python scripts/generate_ui_theme.py --check

      - name: Run tests
        run: cargo test --workspace

      - name: Check workspace
        run: cargo check --workspace

  test-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical AMRI visual assets and developer bundle
        run: |
          python3 ../../scripts/verify_visual_assets.py
          python3 ../../scripts/generate_ui_theme.py --check
          python3 ../../scripts/package_visual_editor.py
          python3 -m zipfile -t ../../dist/AMRI-VPN-Visual-Source.zip

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install cargo-ndk 4.1.2
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Stage pinned official Android transport binaries
        shell: bash
        run: |
          set -euo pipefail
          OUT="../../dist/android-transport-jni"
          rm -rf "$OUT"
          mkdir -p "$OUT/arm64-v8a" "$OUT/x86_64"

          stage_transport() {
            local upstream_arch="$1"
            local android_abi="$2"
            local expected_sha="$3"
            local archive="$RUNNER_TEMP/sing-box-${upstream_arch}.tar.gz"
            local expanded="$RUNNER_TEMP/sing-box-${upstream_arch}"
            local url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-android-${upstream_arch}.tar.gz"
            curl --fail --location --retry 3 "$url" --output "$archive"
            echo "${expected_sha}  ${archive}" | sha256sum --check --strict
            rm -rf "$expanded"
            mkdir -p "$expanded"
            tar -xzf "$archive" -C "$expanded"
            local binary
            binary="$(find "$expanded" -type f -name sing-box -print -quit)"
            test -n "$binary"
            cp "$binary" "$OUT/$android_abi/libsing_box.so"
            chmod 0755 "$OUT/$android_abi/libsing_box.so"
          }

          stage_transport arm64 arm64-v8a "$SING_BOX_ANDROID_ARM64_SHA256"
          stage_transport amd64 x86_64 "$SING_BOX_ANDROID_AMD64_SHA256"
          file "$OUT/arm64-v8a/libsing_box.so" "$OUT/x86_64/libsing_box.so"

      - name: Test and assemble Android with Rust native library
        env:
          AMRI_BUILD_NATIVE: "1"
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify Android native ABIs and transport are packaged
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libamri_android_ffi.so"
          unzip -l "$APK" | grep -F "lib/x86_64/libamri_android_ffi.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libsing_box.so"
          unzip -l "$APK" | grep -F "lib/x86_64/libsing_box.so"
