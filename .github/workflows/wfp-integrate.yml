name: Integrate WFP kill switch runtime

on:
  push:
    branches:
      - work/windows-wfp-killswitch
    paths:
      - .github/workflows/wfp-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/windows-wfp-killswitch
          fetch-depth: 0

      - name: Wire WFP ownership into Windows protected route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/windows/src/system_forwarding.rs')
          text = path.read_text(encoding='utf-8')

          anchor = 'use amri_core::{evaluate_protection, ProtectionSignals, ProtectionState};\n'
          insert = anchor + '#[path = "wfp_kill_switch.rs"]\nmod wfp_kill_switch;\nuse self::wfp_kill_switch::WfpKillSwitch;\n'
          if 'mod wfp_kill_switch;' not in text:
              if anchor not in text:
                  raise SystemExit('missing WFP module insertion anchor')
              text = text.replace(anchor, insert, 1)

          anchor = 'pub(crate) struct WindowsSystemForwarder {\n    shutdown: CancellationToken,\n'
          replacement = 'pub(crate) struct WindowsSystemForwarder {\n    shutdown: CancellationToken,\n    kill_switch: Option<WfpKillSwitch>,\n'
          if 'kill_switch: Option<WfpKillSwitch>' not in text:
              if anchor not in text:
                  raise SystemExit('missing forwarder field anchor')
              text = text.replace(anchor, replacement, 1)

          anchor = '        preflight_runtime()?;\n\n        let shutdown = CancellationToken::new();\n'
          replacement = '        preflight_runtime()?;\n\n        let wfp_bypass_ips = config.bypass_ips.clone();\n        let shutdown = CancellationToken::new();\n'
          if 'let wfp_bypass_ips = config.bypass_ips.clone();' not in text:
              if anchor not in text:
                  raise SystemExit('missing bypass clone anchor')
              text = text.replace(anchor, replacement, 1)

          anchor = '        let mut forwarder = Self {\n            shutdown,\n            state,\n            join: Some(join),\n'
          replacement = '        let mut forwarder = Self {\n            shutdown,\n            kill_switch: None,\n            state,\n            join: Some(join),\n'
          if 'kill_switch: None,' not in text:
              if anchor not in text:
                  raise SystemExit('missing forwarder init anchor')
              text = text.replace(anchor, replacement, 1)

          anchor = '        };\n\n        let readiness = verify_readiness(forwarder.state(), tun_index);\n'
          replacement = '''        };\n\n        let kill_switch = match WfpKillSwitch::activate(tun_index, &wfp_bypass_ips) {\n            Ok(kill_switch) => kill_switch,\n            Err(error) => {\n                forwarder.stop();\n                return Err(format!("failed to activate Windows WFP kill switch: {error}"));\n            }\n        };\n        forwarder.kill_switch = Some(kill_switch);\n\n        let readiness = verify_readiness(forwarder.state(), tun_index);\n'''
          if 'failed to activate Windows WFP kill switch' not in text:
              if anchor not in text:
                  raise SystemExit('missing activation anchor')
              text = text.replace(anchor, replacement, 1)

          anchor = '        self.state() == WindowsForwardingState::Running && self.readiness.protected()\n'
          replacement = '        self.state() == WindowsForwardingState::Running\n            && self.kill_switch.is_some()\n            && self.readiness.protected()\n'
          if '&& self.kill_switch.is_some()' not in text:
              if anchor not in text:
                  raise SystemExit('missing is_running anchor')
              text = text.replace(anchor, replacement, 1)

          anchor = '        if let Some(join) = self.join.take() {\n            let _ = join.join();\n        }\n        if self.state() != WindowsForwardingState::Failed {\n'
          replacement = '        if let Some(join) = self.join.take() {\n            let _ = join.join();\n        }\n        let _ = self.kill_switch.take();\n        if self.state() != WindowsForwardingState::Failed {\n'
          if 'let _ = self.kill_switch.take();' not in text:
              if anchor not in text:
                  raise SystemExit('missing teardown anchor')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')

          main = Path('apps/windows/src/main.rs')
          ui = main.read_text(encoding='utf-8')
          old = '"Protected TUN/DNS path is fail-closed while connected; persistent WFP kill switch is not enabled",\n            "PARTIAL",'
          new = '"Dynamic WFP kill switch is required before a protected Windows route can become Ready",\n            "ENABLED",'
          if old not in ui:
              raise SystemExit('missing Windows kill-switch UI truth anchor')
          ui = ui.replace(old, new)
          main.write_text(ui, encoding='utf-8')

          for obsolete in [
              'apps/windows/src/bin/amri-wfp-compile-check.rs',
              'apps/windows/src/bin/amri-wfp-lifecycle-compile-check.rs',
              'apps/windows/src/bin/README-WFP-CHECK.txt',
              'apps/windows/src/bin/.wfp-gate',
              'apps/windows/src/wfp_kill_switch_lifecycle.rs',
              'apps/windows/src/wfp_kill_switch_compile_contract.rs',
              'apps/windows/src/wfp_kill_switch_runtime_notes.md',
          ]:
              p = Path(obsolete)
              if p.exists():
                  p.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire dynamic WFP kill switch into Windows runtime"
          git push origin HEAD:work/windows-wfp-killswitch
