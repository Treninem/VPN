name: Install verified AMRI icon

on:
  push:
    branches: [main]
    paths:
      - '.github/icon-upload/**'
      - '.github/workflows/install-amri-icon.yml'

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until all verified parts exist
        id: parts
        shell: bash
        run: |
          if [[ -f .github/icon-upload/part-01.b64 && -f .github/icon-upload/part-02.b64 && -f .github/icon-upload/part-03.b64 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct exact icon and verify SHA-256
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p assets/brand
          cat .github/icon-upload/part-01.b64 .github/icon-upload/part-02.b64 .github/icon-upload/part-03.b64 | base64 --decode > assets/brand/amri-icon.png
          echo "da0d94669a9fe8f8c7341fa9c582c247dd40163955d64f61ccf17701ad4cf8f4  assets/brand/amri-icon.png" | sha256sum --check --strict
          file assets/brand/amri-icon.png

      - name: Commit verified icon only
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/amri-icon.png
          if git diff --cached --quiet; then
            echo "Icon already matches verified bytes."
            exit 0
          fi
          git commit -m "Install verified AMRI VPN app icon"
          git push
