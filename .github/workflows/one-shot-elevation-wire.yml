name: One-shot wire connect elevation

on:
  push:
    branches: [work/release-critical-fixes]

permissions:
  contents: write

concurrency:
  group: one-shot-elevation-wire
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/release-critical-fixes
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire elevated reconnect into Windows UI
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('apps/windows/src/main.rs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'mod secure_nodes;\nmod theme;\nmod transport_worker;',
                  'mod elevation;\nmod secure_nodes;\nmod theme;\nmod transport_worker;'
              ),
              (
                  '    selected_node: usize,\n    routing_mode: RoutingMode,',
                  '    selected_node: usize,\n    pending_auto_connect: Option<usize>,\n    routing_mode: RoutingMode,'
              ),
              (
                  '        let (imported_nodes, transport_state) = match secure_nodes::load() {\n            Ok(nodes) => (nodes, TransportUiState::Idle),\n            Err(error) => (Vec::new(), TransportUiState::Failed(error)),\n        };\n\n        Self {',
                  '        let (imported_nodes, transport_state) = match secure_nodes::load() {\n            Ok(nodes) => (nodes, TransportUiState::Idle),\n            Err(error) => (Vec::new(), TransportUiState::Failed(error)),\n        };\n        let pending_auto_connect = elevation::requested_connect_index()\n            .filter(|index| *index < imported_nodes.len());\n        let selected_node = pending_auto_connect.unwrap_or(0);\n\n        Self {'
              ),
              (
                  '            imported_nodes,\n            selected_node: 0,\n            routing_mode: RoutingMode::Smart,',
                  '            imported_nodes,\n            selected_node,\n            pending_auto_connect,\n            routing_mode: RoutingMode::Smart,'
              ),
              (
                  '        let port = match self.local_port.trim().parse::<u16>() {\n            Ok(port) if port != 0 => port,\n            _ => {\n                self.transport_state =\n                    TransportUiState::Failed("local port must be between 1 and 65535".into());\n                return;\n            }\n        };\n\n        match self',
                  '        let port = match self.local_port.trim().parse::<u16>() {\n            Ok(port) if port != 0 => port,\n            _ => {\n                self.transport_state =\n                    TransportUiState::Failed("local port must be between 1 and 65535".into());\n                return;\n            }\n        };\n\n        match elevation::is_process_elevated() {\n            Ok(true) => {}\n            Ok(false) => match elevation::restart_elevated_for_connect(self.selected_node) {\n                Ok(()) => std::process::exit(0),\n                Err(error) => {\n                    self.transport_state = TransportUiState::Failed(error);\n                    return;\n                }\n            },\n            Err(error) => {\n                self.transport_state = TransportUiState::Failed(error);\n                return;\n            }\n        }\n\n        match self'
              ),
              (
                  '    fn ui(&mut self, ui: &mut egui::Ui, _frame: &mut eframe::Frame) {\n        self.refresh_transport_state(ui.ctx());\n        egui::CentralPanel::default()',
                  '    fn ui(&mut self, ui: &mut egui::Ui, _frame: &mut eframe::Frame) {\n        self.refresh_transport_state(ui.ctx());\n        if let Some(index) = self.pending_auto_connect.take() {\n            if index < self.imported_nodes.len() {\n                self.selected_node = index;\n                self.start_transport();\n            }\n        }\n        egui::CentralPanel::default()'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected patch pattern was not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          '@ | python -
          cargo fmt --all
          Remove-Item .github/workflows/one-shot-elevation-wire.yml
      - name: Commit elevation wiring
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows/src/main.rs .github/workflows/one-shot-elevation-wire.yml
          git commit -m "Elevate only when Windows VPN connects"
          git push origin HEAD:work/release-critical-fixes
