name: Install exact AMRI power buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/power-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact RGBA pixels and canonical PNG files
        shell: python3 {0}
        run: |
          from pathlib import Path
          import base64, binascii, hashlib, lzma, struct, zlib

          W = H = 1254
          ROW = W * 4

          items = {
              'off': {
                  'raw_sha': '6d19aac0ea5e4556c2129ad453ad3336f4a08881488df01d009ba187b9b110d8',
                  'png_sha': 'eac85885eb8e9732f69cbda18b313e89867a90d0d16e1c245e1cb0f415b08e30',
                  'git_blob': '806c8645b8a64b60d96b97ddcc7af5af3a513cdc',
              },
              'on': {
                  'raw_sha': '4f16ece20c0b30b6976ff0bf5e8fc5601e150127ef57d5c604abe636878d9840',
                  'png_sha': 'b47a4a710215045ba3a65dc22439ff4de40f7a3e779b8c9c62e878e778f07ac0',
                  'git_blob': 'a7ebcd58990c37a8cc96cf8469e67a4033b999d2',
              },
          }

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          def png_from_up(filtered):
              if len(filtered) != ROW * H:
                  raise SystemExit(f'Unexpected filtered RGBA byte count: {len(filtered)}')
              scan = bytearray()
              raw = bytearray(len(filtered))
              previous = bytearray(ROW)
              for y in range(H):
                  residual = filtered[y * ROW:(y + 1) * ROW]
                  current = bytearray(ROW)
                  for i, value in enumerate(residual):
                      current[i] = (value + previous[i]) & 0xff
                  raw[y * ROW:(y + 1) * ROW] = current
                  scan.append(2)
                  scan.extend(residual)
                  previous = current
              signature = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', W, H, 8, 6, 0, 0, 0)
              png = signature + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(bytes(scan), 9)) + chunk(b'IEND', b'')
              return bytes(raw), png

          for state, expected in items.items():
              pieces = sorted(Path('.github/power-upload').glob(f'{state}-*.xz.b64'))
              if not pieces:
                  raise SystemExit(f'No upload pieces for {state}')
              encoded = ''.join(p.read_text(encoding='ascii').strip() for p in pieces)
              filtered = lzma.decompress(base64.b64decode(encoded))
              raw, png = png_from_up(filtered)
              if hashlib.sha256(raw).hexdigest() != expected['raw_sha']:
                  raise SystemExit(f'{state}: RGBA pixel hash mismatch')
              if hashlib.sha256(png).hexdigest() != expected['png_sha']:
                  raise SystemExit(f'{state}: deterministic PNG hash mismatch')
              header = f'blob {len(png)}\0'.encode()
              git_blob = hashlib.sha1(header + png).hexdigest()
              if git_blob != expected['git_blob']:
                  raise SystemExit(f'{state}: Git blob mismatch {git_blob}')
              Path(f'assets/brand/vpn-power-{state}.png').write_bytes(png)

      - name: Switch project from old SVGs to exact PNGs
        shell: python3 {0}
        run: |
          from pathlib import Path
          import subprocess

          root = Path('.')
          old_new = {
              'vpn-power-off.svg': 'vpn-power-off.png',
              'vpn-power-on.svg': 'vpn-power-on.png',
          }

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              path = root / raw.decode('utf-8')
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in old_new.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          activity = root / 'apps/android/app/src/main/java/ru/amri/vpn/MainActivity.kt'
          text = activity.read_text(encoding='utf-8')
          text = text.replace('import android.graphics.Color\n', 'import android.graphics.BitmapFactory\nimport android.graphics.Color\n', 1)
          text = text.replace('actionButton = svgPowerButton()', 'actionButton = pngPowerButton()', 1)
          text = text.replace('        setSvg(actionButton, imageRes)\n', '        setPng(actionButton, imageRes)\n', 1)
          old_block = '''    private fun svgPowerButton(): ImageButton = svgIconButton(\n        R.raw.amri_vpn_power_off,\n        getString(R.string.prepare_vpn),\n    )\n'''
          new_block = '''    private fun pngPowerButton(): ImageButton = ImageButton(this).apply {\n        background = null\n        setPadding(0, 0, 0, 0)\n        scaleType = ImageView.ScaleType.FIT_CENTER\n        contentDescription = this@MainActivity.getString(R.string.prepare_vpn)\n        setLayerType(View.LAYER_TYPE_SOFTWARE, null)\n        setPng(this, R.raw.amri_vpn_power_off)\n    }\n'''
          if old_block not in text:
              raise SystemExit('Expected svgPowerButton block not found')
          text = text.replace(old_block, new_block, 1)
          svg_marker = '    private fun setSvg(target: ImageView, resourceId: Int) {\n'
          png_helper = '''    private fun setPng(target: ImageView, resourceId: Int) {\n        target.setImageBitmap(BitmapFactory.decodeResource(resources, resourceId))\n    }\n\n'''
          if svg_marker not in text:
              raise SystemExit('Expected setSvg helper not found')
          text = text.replace(svg_marker, png_helper + svg_marker, 1)
          activity.write_text(text, encoding='utf-8')

          lock_path = root / 'assets/brand/asset-blobs.lock'
          lines = lock_path.read_text(encoding='utf-8').splitlines()
          kept = [line for line in lines if not line.rstrip().endswith(('vpn-power-off.png', 'vpn-power-on.png'))]
          kept.append('806c8645b8a64b60d96b97ddcc7af5af3a513cdc  vpn-power-off.png')
          kept.append('a7ebcd58990c37a8cc96cf8469e67a4033b999d2  vpn-power-on.png')
          header = [line for line in kept if line.startswith('#')]
          entries = sorted(line for line in kept if line and not line.startswith('#'))
          lock_path.write_text('\n'.join(header + entries) + '\n', encoding='utf-8')

          readme = root / 'assets/brand/README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'Do **not** use the earlier raster ON button with the solid dark square background. It was superseded by `vpn-power-on.png`.',
              'The `vpn-power-off.png` and `vpn-power-on.png` files are the exact user-approved 1254×1254 RGBA power-state images. Their RGBA pixel matrices are locked and must not be redrawn, resized, cropped, recolored, filtered, or otherwise changed.',
          )
          readme.write_text(text, encoding='utf-8')

      - name: Remove superseded SVG files and temporary upload helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/brand/vpn-power-off.svg assets/brand/vpn-power-on.svg
          rm -rf .github/power-upload
          rm -f .github/workflows/install-exact-power-buttons.yml
          if git grep -n -E 'vpn-power-(on|off)\.svg' -- . ':!docs/DEV_JOURNAL.md'; then
            echo 'Stale old SVG power-button reference remains.' >&2
            exit 1
          fi

      - name: Verify exact final bytes and references
        shell: bash
        run: |
          set -euo pipefail
          echo 'eac85885eb8e9732f69cbda18b313e89867a90d0d16e1c245e1cb0f415b08e30  assets/brand/vpn-power-off.png' | sha256sum -c -
          echo 'b47a4a710215045ba3a65dc22439ff4de40f7a3e779b8c9c62e878e778f07ac0  assets/brand/vpn-power-on.png' | sha256sum -c -
          test "$(git hash-object assets/brand/vpn-power-off.png)" = '806c8645b8a64b60d96b97ddcc7af5af3a513cdc'
          test "$(git hash-object assets/brand/vpn-power-on.png)" = 'a7ebcd58990c37a8cc96cf8469e67a4033b999d2'
          python3 scripts/verify_visual_assets.py

      - name: Commit exact user-approved power buttons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use exact user-approved VPN power buttons'
          git push origin HEAD:main
