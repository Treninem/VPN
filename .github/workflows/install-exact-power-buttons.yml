name: Install exact AMRI power buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/power-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact uploaded PNG files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/power-upload/off-*.b64 | base64 --decode > assets/brand/vpn-power-off.png
          cat .github/power-upload/on-*.b64  | base64 --decode > assets/brand/vpn-power-on.png
          echo '9e2c0fc24cd11b8f794a6b0f2b122ab0ce4c0c5a3732368f6ccaf5d87dab3dda  assets/brand/vpn-power-off.png' | sha256sum -c -
          echo 'c4b33f20a4b2f7e13590c13fdd2d5f8564e9d05ed6ea0a482f488c6f87b3316d  assets/brand/vpn-power-on.png'  | sha256sum -c -
          test "$(git hash-object assets/brand/vpn-power-off.png)" = 'f86da87979f7f4f8e1623230ffa5b091f9edf1ce'
          test "$(git hash-object assets/brand/vpn-power-on.png)"  = 'c94bea6e77ee82a22fc82d105576b7be00546ccd'

      - name: Switch project from old SVGs to exact PNGs
        shell: python3 {0}
        run: |
          from pathlib import Path
          import subprocess

          root = Path('.')
          old_new = {
              'vpn-power-off.svg': 'vpn-power-off.png',
              'vpn-power-on.svg': 'vpn-power-on.png',
          }

          # Update every tracked UTF-8 text reference so no stale SVG path survives.
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              path = root / raw.decode('utf-8')
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in old_new.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Android: power states are now PNG resources, while the other icons remain SVG.
          activity = root / 'apps/android/app/src/main/java/ru/amri/vpn/MainActivity.kt'
          text = activity.read_text(encoding='utf-8')
          text = text.replace(
              'import android.graphics.Color\n',
              'import android.graphics.BitmapFactory\nimport android.graphics.Color\n',
              1,
          )
          text = text.replace('actionButton = svgPowerButton()', 'actionButton = pngPowerButton()', 1)
          text = text.replace('        setSvg(actionButton, imageRes)\n', '        setPng(actionButton, imageRes)\n', 1)
          old_block = '''    private fun svgPowerButton(): ImageButton = svgIconButton(\n        R.raw.amri_vpn_power_off,\n        getString(R.string.prepare_vpn),\n    )\n'''
          new_block = '''    private fun pngPowerButton(): ImageButton = ImageButton(this).apply {\n        background = null\n        setPadding(0, 0, 0, 0)\n        scaleType = ImageView.ScaleType.FIT_CENTER\n        contentDescription = this@MainActivity.getString(R.string.prepare_vpn)\n        setLayerType(View.LAYER_TYPE_SOFTWARE, null)\n        setPng(this, R.raw.amri_vpn_power_off)\n    }\n'''
          if old_block not in text:
              raise SystemExit('Expected svgPowerButton block not found')
          text = text.replace(old_block, new_block, 1)
          svg_marker = '''    private fun setSvg(target: ImageView, resourceId: Int) {\n'''
          png_helper = '''    private fun setPng(target: ImageView, resourceId: Int) {\n        target.setImageBitmap(BitmapFactory.decodeResource(resources, resourceId))\n    }\n\n'''
          if svg_marker not in text:
              raise SystemExit('Expected setSvg helper not found')
          text = text.replace(svg_marker, png_helper + svg_marker, 1)
          activity.write_text(text, encoding='utf-8')

          # Lock the exact approved bytes under their new canonical PNG names.
          lock_path = root / 'assets/brand/asset-blobs.lock'
          lines = lock_path.read_text(encoding='utf-8').splitlines()
          kept = [line for line in lines if not line.rstrip().endswith(('vpn-power-off.png', 'vpn-power-on.png'))]
          kept.append('f86da87979f7f4f8e1623230ffa5b091f9edf1ce  vpn-power-off.png')
          kept.append('c94bea6e77ee82a22fc82d105576b7be00546ccd  vpn-power-on.png')
          header = [line for line in kept if line.startswith('#')]
          entries = sorted(line for line in kept if line and not line.startswith('#'))
          lock_path.write_text('\n'.join(header + entries) + '\n', encoding='utf-8')

          readme = root / 'assets/brand/README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'Do **not** use the earlier raster ON button with the solid dark square background. It was superseded by `vpn-power-on.png`.',
              'The `vpn-power-off.png` and `vpn-power-on.png` files are the exact user-approved power-state PNGs. Do not redraw, resize, crop, recolor, re-encode, or otherwise alter their pixels; only these exact locked bytes are approved.',
          )
          readme.write_text(text, encoding='utf-8')

      - name: Remove superseded SVG files and temporary upload helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/brand/vpn-power-off.svg assets/brand/vpn-power-on.svg
          rm -rf .github/power-upload
          rm -f .github/workflows/install-exact-power-buttons.yml
          if git grep -n -E 'vpn-power-(on|off)\.svg' -- . ':!docs/DEV_JOURNAL.md'; then
            echo 'Stale old SVG power-button reference remains.' >&2
            exit 1
          fi

      - name: Verify exact final bytes and references
        shell: bash
        run: |
          set -euo pipefail
          echo '9e2c0fc24cd11b8f794a6b0f2b122ab0ce4c0c5a3732368f6ccaf5d87dab3dda  assets/brand/vpn-power-off.png' | sha256sum -c -
          echo 'c4b33f20a4b2f7e13590c13fdd2d5f8564e9d05ed6ea0a482f488c6f87b3316d  assets/brand/vpn-power-on.png' | sha256sum -c -
          python3 scripts/verify_visual_assets.py

      - name: Commit exact user-approved power buttons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use exact user-approved VPN power buttons'
          git push origin HEAD:main
