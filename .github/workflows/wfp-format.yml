name: Format WFP integration

on:
  push:
    branches:
      - work/windows-wfp-killswitch
    paths:
      - .github/workflows/wfp-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/windows-wfp-killswitch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting and remove this one-shot gate
        shell: bash
        run: |
          cargo fmt --all
          git rm .github/workflows/wfp-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format Windows WFP kill switch integration"
          git push origin HEAD:work/windows-wfp-killswitch
