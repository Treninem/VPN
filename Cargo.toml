[workspace]
members = [
  "crates/amri-core",
  "crates/amri-storage",
  "crates/amri-subscriptions",
  "crates/amri-probe",
  "crates/amri-federation",
  "crates/amri-transport",
  "crates/amri-runtime",
  "crates/amri-secrets",
  "crates/amri-external-core",
  "crates/amri-node-config",
  "apps/windows"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Treninem"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = "1"
