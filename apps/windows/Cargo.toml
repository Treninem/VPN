[package]
name = "amri-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.36.2", default-features = true }
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
amri-core = { path = "../../crates/amri-core" }
amri-subscriptions = { path = "../../crates/amri-subscriptions" }
amri-node-config = { path = "../../crates/amri-node-config" }
amri-transport = { path = "../../crates/amri-transport" }
amri-external-core = { path = "../../crates/amri-external-core" }
tun2proxy = { version = "=0.8.3", default-features = false }
tun = { version = "=0.8.14", features = ["async"] }
tproxy-config = { version = "=7.0.7", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
